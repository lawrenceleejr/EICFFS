name: eicffs
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pythia8>=8.309
  - fastjet>=3.4
  - uproot>=5
  - awkward>=2
  - vector>=1
  - numpy
  - matplotlib>=3.8
  - scipy
  - hist>=2.7
  - particle
  - tqdm
  - pyarrow
  - pandas
  - pyhepmc       # HepMC reading (Herwig leg)
  - pip
  - pip:
      - mplhep
# Note: the Herwig 7 leg (run_herwig.sh) needs a Herwig installation,
# which is not available via conda-forge or PyPI.  Build from source
# (LHAPDF + HepMC2 + fastjet + ThePEG + Herwig, see RESULTS.md) or use
# an LCG/CVMFS environment, then set HEP_PREFIX.
