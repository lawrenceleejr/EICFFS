version: "3.9"

services:
  eicffs:
    build:
      context: .
      dockerfile: Dockerfile
    image: eicffs:latest
    volumes:
      # Mount local data directory for output persistence
      - ./data:/work/data
      - ./figures:/work/figures
      - ./plots:/work/plots
    environment:
      - PYTHIA8DATA=/opt/conda/share/Pythia8/xmldoc
    command: /work/run.sh

  # Run only event generation (one seed; run several with different --seed)
  generate:
    image: eicffs:latest
    volumes:
      - ./data:/work/data
    environment:
      - PYTHIA8DATA=/opt/conda/share/Pythia8/xmldoc
    command: >
      python generate_events.py
        --n-events 300000
        --seed 1
        --Wmin 10
        --output /work/data/events_1.parquet
        --quiet

  # Run only analysis
  analyze:
    image: eicffs:latest
    volumes:
      - ./data:/work/data
    command: >
      python analyze_events.py
        /work/data/events_*.parquet
        --output /work/data/analysis.root

  # Run only plotting
  plot:
    image: eicffs:latest
    volumes:
      - ./data:/work/data
      - ./figures:/work/figures
    command: >
      python make_figures.py
        /work/data/analysis.root
        --events /work/data/events_1.parquet
        --outdir /work/figures
